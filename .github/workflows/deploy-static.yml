name: Publish approved static site

env:
  VITE_INSTAGRAM_FEED_URL: ${{ vars.INSTAGRAM_FEED_URL }}

# No push/PR trigger: publication is a separate, explicit human action.
on:
  workflow_dispatch:
    inputs:
      approved_public_release:
        description: I approve making this revision public, have verified Azure Free eligibility, and accept the public contact details.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-static-site
  cancel-in-progress: false

jobs:
  publish:
    # Standard Linux runners in public repositories have free Actions minutes.
    # Private-repository billing has not been verified, so this workflow refuses it.
    if: inputs.approved_public_release && !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check static-only release and conservative Free size limits
        run: |
          node --input-type=module <<'NODE'
          import { readdir, stat, access, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          let count = 0, bytes = 0;
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name);
              if (entry.isDirectory()) await walk(path);
              else { count++; bytes += (await stat(path)).size; }
            }
          }
          await walk('dist');
          await access('dist/index.html');
          JSON.parse(await readFile('dist/staticwebapp.config.json', 'utf8'));
          for (const path of ['dist/api', 'dist/_worker.js']) {
            const exists = await access(path).then(() => true, () => false);
            if (exists) throw new Error(`Static-only release cannot include ${path}`);
          }
          if (count > 15000 || bytes > 240000000) throw new Error(`Free guard exceeded: ${count} files / ${bytes} bytes`);
          console.log(`Static release: ${count} files, ${bytes} bytes`);
          NODE
      - name: Upload built static files
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          api_location: ''
          skip_app_build: true
          skip_api_build: true
