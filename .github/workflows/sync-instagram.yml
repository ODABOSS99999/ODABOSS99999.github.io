name: Refresh Instagram snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'

permissions:
  contents: write

concurrency:
  group: instagram-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.INSTAGRAM_SYNC_ENABLED == 'true' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test scripts/instagram-sync.test.mjs
      - name: Refresh local static feed
        run: node scripts/instagram-sync.mjs
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
      - name: Commit changed snapshot only
        run: |
          git add -- public/instagram
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Instagram snapshot'
          git push origin HEAD:${{ github.event.repository.default_branch }}

# This workflow never deploys. Publishing remains a separately approved action.
